<style>

:root[data-theme="dark"]{--fb:#0a1a3d;--fr:#6d0f1d;--fx:#aeb8d6;--bg:#0e1326;--card:#171d36;--ink:#eef1fb;--muted:#a3accb;--blue:#6d96ff;--red:#ff6b8b;--ok:#34d399;--line:#2a3256;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:linear-gradient(var(--fx),var(--fx)) center/100% 44px no-repeat,linear-gradient(var(--fx),var(--fx)) center/44px 100% no-repeat,conic-gradient(var(--fr) 0 25%,var(--fb) 0 50%,var(--fr) 0 75%,var(--fb) 0);background-attachment:fixed;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--blue),var(--red));color:#fff;border-radius:20px;padding:28px 22px;text-align:center}
.hero h1{margin:0 0 8px;font-size:1.8rem;line-height:1.2}
.hero p{margin:0;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
h2{margin:0 0 10px;font-size:1.2rem}
.btn{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 15px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.btn:hover,.btn:focus-visible{border-color:var(--blue);transform:translateY(-1px)}
.c{text-align:center}
.muted{color:var(--muted);font-size:.92rem}
.pill{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:2px 10px;font-size:.8rem}
.bar{height:16px;background:var(--line);border-radius:99px;position:relative;margin:14px 0 6px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--red));border-radius:99px;transition:width .5s}
.plane{position:absolute;top:-10px;left:0;font-size:22px;transition:left .5s;transform:translateX(-50%)}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:12px;margin:10px 0;cursor:pointer}
.step.done{border-color:var(--ok);opacity:.8}
.step input{width:22px;height:22px;margin-top:3px;accent-color:var(--ok);flex:none}
.step b{display:block}
.step.done b{text-decoration:line-through}
.badge{font-size:1.05rem;font-weight:700}
.link{color:var(--blue)}
.pop{position:fixed;left:0;right:0;top:35%;text-align:center;font-size:3rem;pointer-events:none;animation:up 1.4s forwards}
@keyframes up{to{transform:translateY(-120px);opacity:0}}
.chip{display:inline-block;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;margin:0 6px 6px 0;font:inherit;cursor:pointer}.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.site{border:2px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.site a{color:var(--blue);font-weight:700}
.late{border-color:var(--red)}
.fcard{min-height:150px;border:2px solid var(--blue);border-radius:16px;padding:18px;cursor:pointer;text-align:center;margin:10px 0}.fcard.flip{border-color:var(--ok)}
.sp{float:right;border:0;background:none;font-size:1.2rem;cursor:pointer}
label{display:block;font-weight:600;margin-top:10px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.step input{width:22px;padding:0}
.paper{background:#fff;color:#111;border:1px solid var(--line);padding:22px;font:14px/1.4 Georgia,serif;border-radius:6px;margin-bottom:12px}
.paper h3{margin:0;font-size:1.7rem}.paper .sm{font-size:.85rem;color:#555}
.paper .sec{font:700 .8rem system-ui,sans-serif;letter-spacing:.08em;border-bottom:2px solid #111;margin:14px 0 6px;padding-bottom:2px}
.paper ul{margin:4px 0 8px;padding-left:20px}
.paper.classic .hd{text-align:center}
.paper.modern .hd{background:#002d62;color:#fff;margin:-22px -22px 10px;padding:18px 22px}.paper.modern .hd .sm{color:#dbe4ff}
.paper.modern .sec{color:#ce1126;border-color:#ce1126}
@media print{body *{visibility:hidden}#paper,#paper *{visibility:visible}#paper{position:absolute;left:0;top:0;width:100%;border:0}body{background:#fff}}
[hidden]{display:none!important}

h1:["Your Path to Working in the USA","Tu camino para trabajar en EE. UU."],

n_map:["🗺️ Visa Map","🗺️ Mapa de visa"],n_res:["📄 Resume","📄 Currículum"],n_prep:["🎤 Interview","🎤 Entrevista"],n_plan:["📅 Planner","📅 Planificador"],

r_s:["✨ Fill with an example","✨ Llenar con un ejemplo"],r_t:["Pick a template:","Elige una plantilla:"],r_c:["Classic","Clásica"],r_m:["Modern","Moderna"],r_v:["👀 Preview","👀 Vista previa"],r_d:["⬇️ Download PDF","⬇️ Descargar PDF"],

var Q=[
{q:["1. Do you already have a job offer from a US employer?","1. ¿Ya tienes una oferta de trabajo de un empleador en EE. UU.?"],a:[[["✅ Yes, I have an offer","✅ Sí, tengo una oferta"],"y"],[["🔍 Not yet","🔍 Todavía no"],"n"]]},

var PATHS={
farm:{t:["🌾 Your path: H-2A (farm work visa)","🌾 Tu camino: H-2A (visa de trabajo agrícola)"],d:["A temporary visa for agricultural jobs. The Dominican Republic has been on the eligible list for this one.","Una visa temporal para trabajos agrícolas. La República Dominicana ha estado en la lista de países elegibles."],s:[
["Your employer starts the process","Tu empleador inicia el proceso","The farm gets approval from the US Department of Labor, then files a petition with USCIS. You cannot file this part yourself.","La finca obtiene la aprobación del Departamento de Trabajo de EE. UU. y luego presenta una petición ante USCIS. Tú no puedes hacer esta parte."],

["Your employer starts the process","Tu empleador inicia el proceso","They get Department of Labor approval, then file a petition with USCIS. Ask them early, because spots run out.","Obtienen la aprobación del Departamento de Trabajo y luego presentan una petición ante USCIS. Pregúntales temprano, porque los cupos se agotan."],
["Get your approval notice","Recibe tu aviso de aprobación","After approval, the employer sends you the notice (Form I-797) and job details. Keep copies safe.","Tras la aprobación, el empleador te envía el aviso (Formulario I-797) y los detalles del trabajo. Guarda copias."]]},
pro:{t:["🎓 Your path: H-1B (professional visa)","🎓 Tu camino: H-1B (visa profesional)"],d:["For jobs that require a college degree. It is competitive and the employer does most of the work.","Para trabajos que requieren título universitario. Es muy competitiva y el empleador hace la mayor parte del trabajo."],s:[
["Your employer enters the yearly selection","Tu empleador entra a la selección anual","Employers usually register in March for a lottery, then file a petition if selected. Recent rule changes added costs, so ask the employer’s attorney what applies to you.","Los empleadores normalmente se registran en marzo para un sorteo y presentan la petición si son seleccionados. Cambios recientes agregaron costos, así que pregunta al abogado del empleador qué te aplica."],

["Fill out the DS-160","Llena el formulario DS-160","This is the online visa application at ceac.state.gov. Match your passport name exactly and save the confirmation page with the barcode.","Es la solicitud de visa en línea en ceac.state.gov. Usa tu nombre exactamente como en el pasaporte y guarda la página de confirmación con el código de barras."],
["Pay the fee and book your interview","Paga la tarifa y agenda tu entrevista","Use the official system for the US Embassy in Santo Domingo. Fees change, so check travel.state.gov for the current amount.","Usa el sistema oficial de la Embajada de EE. UU. en Santo Domingo. Las tarifas cambian, revisa travel.state.gov para el monto actual."],
["Gather your documents","Reúne tus documentos","Passport, DS-160 confirmation, approval notice, interview letter, photo, job offer letter, and proof of ties to the Dominican Republic like family or property.","Pasaporte, confirmación del DS-160, aviso de aprobación, carta de la entrevista, foto, carta de oferta de trabajo y pruebas de tus vínculos con la República Dominicana, como familia o propiedades."],
["Ace the interview","Triunfa en la entrevista","Be honest, keep answers short and clear, and know your job, employer, and dates by heart. Practice in the Interview tab!","Sé honesto, responde corto y claro, y sabe de memoria tu trabajo, tu empleador y tus fechas. ¡Practica en la pestaña Entrevista!"],
